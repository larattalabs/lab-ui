# Gradle daemon memory (decompiling Minecraft for genSources needs a few GB).
org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Fabric Properties: the same versions as AgentCraft Worlds and Architect.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2

# Mod Properties (semver; the release tag v<mod_version> publishes it, see README.md "Versioning")
mod_version=0.1.0
maven_group=dev.larattalabs
archives_base_name=lab_ui

# Dependencies
fabric_api_version=0.161.0+26.3
# Unit tests
junit_version=5.13.4
