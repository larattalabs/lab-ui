plugins {
	// Minecraft 26.x is unobfuscated: the non-remapping Loom plugin is used (no mappings, no remapJar).
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"lab_ui" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Unit tests (src/test/java) for the pure classes (TextDepth, LeaderGaps, Guard).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// A consumer that includeBuild()s a lab-ui checkout (a composite build) compiles against the "classes" secondary variant
// of apiElements / runtimeElements, which the java plugin fills with the main source set only: the split client classes
// (dev.larattalabs.labui.client.*) were missing there, though the jar has them. Add the client classes (and, at runtime,
// the client resources) to those variants, so a composite consumer resolves the same classes as the published jar.
// Consumers that force the jar variant (Architect's and AgentCraft's build.gradle) are unaffected.
["apiElements", "runtimeElements"].each { name ->
	configurations.named(name) {
		outgoing.variants.named("classes") {
			sourceSets.client.output.classesDirs.each { dir ->
				artifact(dir) {
					type = ArtifactTypeDefinition.JVM_CLASS_DIRECTORY
					builtBy(sourceSets.client.output)
				}
			}
		}
	}
}
configurations.named("runtimeElements") {
	outgoing.variants.named("resources") {
		artifact(sourceSets.client.output.resourcesDir) {
			type = ArtifactTypeDefinition.JVM_RESOURCES_DIRECTORY
			builtBy(sourceSets.client.output)
		}
	}
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// MIT: the licence and the attribution notice travel with every copy, also a jar nested in a consumer's jar (jar-in-jar).
jar {
	from("LICENSE", "NOTICE")
}

tasks.matching { it.name == "sourcesJar" }.configureEach {
	from("LICENSE", "NOTICE")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

// `./gradlew publishToMavenLocal` publishes dev.larattalabs:lab_ui:<version> (the mod jar plus a sources jar).
publishing {
	publications {
		mavenJava(MavenPublication) {
			groupId = 'dev.larattalabs'
			artifactId = 'lab_ui'
			from components.java
		}
	}
	// CI on release tags (.github/workflows/publish.yml): GitHub Packages, only when the workflow's token is there
	if (System.getenv("GITHUB_TOKEN")) {
		repositories {
			maven {
				name = 'GitHubPackages'
				url = uri('https://maven.pkg.github.com/larattalabs/lab-ui')
				credentials {
					username = System.getenv('GITHUB_ACTOR')
					password = System.getenv('GITHUB_TOKEN')
				}
			}
		}
	}
}
